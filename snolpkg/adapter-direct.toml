name = "owenewans/adapter-direct"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["adapter"]
family = "direct"
roles = ["server"]
entry = "lib/libsnolc_adapter_direct.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-adapter-direct"

[[templates]]
role = "server"
source = "config/templates/modules/direct.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["server"]
capabilities = ["connect", "dns", "tcp", "udp"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["server"]
capabilities = ["connect", "dns", "tcp", "udp"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["server"]
capabilities = ["connect", "dns", "tcp", "udp"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-direct-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 354005
sha256 = "1bcdf99a6033b812b084cc73d76f2275c6188278372aa6be6431b23e593da725"
build_output = "release/libsnolc_adapter_direct.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-direct-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 339663
sha256 = "9580fd551f6258120916bd2c676c32d1f334379c8523231dd52c2846ca3ff6a6"
build_output = "release/libsnolc_adapter_direct.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-direct-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 310840
sha256 = "4634a6f1aa5f13a15efe1ab6044829cd1b96f7da961f6cf2ac7dc47da0fee4dc"
build_output = "release/libsnolc_adapter_direct.so"
