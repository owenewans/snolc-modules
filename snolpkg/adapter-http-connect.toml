name = "owenewans/adapter-http-connect"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.2"
wire_version = 1
classes = ["adapter"]
family = "http-connect"
roles = ["client"]
entry = "lib/libsnolc_adapter_http_connect.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-adapter-http-connect"

[[templates]]
role = "client"
source = "config/templates/modules/http-connect.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.2/adapter-http-connect-0.0.2-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 297261
sha256 = "e50d80063ba7ab6a91be8898c5b201d481154d0c4656830ea27b4bd125836b86"
build_output = "release/libsnolc_adapter_http_connect.so"

[[artifacts]]
