name = "owenewans/adapter-tun"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["adapter"]
family = "tun"
roles = ["client"]
entry = "lib/libsnolc_adapter_tun.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-adapter-tun"

[[templates]]
role = "client"
source = "config/templates/modules/tun-linux.toml"
targets = ["x86_64-unknown-linux-gnu"]

[[templates]]
role = "client"
source = "config/templates/modules/tun-android.toml"
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-tun-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 291455
sha256 = "610c686ec0056a3e0e645efbd93be79f0f156b9568cf1539b6f54dd279acab72"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-tun-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 286750
sha256 = "1fc379b1ab53122a62c0f1aa30fc72b85a4b5be1234a872e53237c0d3eae7b88"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/adapter-tun-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 257793
sha256 = "4d153c5790b1a7e25ee9d48daa02f5a8bf4420cc4345764c7a59d51c9c7d09d8"
build_output = "release/libsnolc_adapter_tun.so"
