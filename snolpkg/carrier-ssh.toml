name = "owenewans/carrier-ssh"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["carrier"]
family = "ssh"
roles = ["client", "server"]
entry = "lib/libsnolc_carrier_ssh.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-carrier-ssh"

[[templates]]
role = "client"
source = "config/templates/modules/ssh-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/ssh.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-ssh-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 1622751
sha256 = "a4194d05d2cc3a3782dd2a90455df78207d0364411cbb2f5d6e2621a7620dafb"
build_output = "release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-ssh-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 1520349
sha256 = "d541d3c8aa6686edb57662a8d0275c1fd916746a1b1aaced2160a692dab63f74"
build_output = "release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-ssh-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 1401060
sha256 = "09754e6516315c23021238b4e9b0852a13015d6007d36b7921e079a776466691"
build_output = "release/libsnolc_carrier_ssh.so"
