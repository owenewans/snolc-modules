name = "owenewans/carrier-tcp"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["carrier"]
family = "tcp"
roles = ["client", "server"]
entry = "lib/libsnolc_carrier_tcp.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-carrier-tcp"

[[templates]]
role = "client"
source = "config/templates/modules/tcp-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/tcp.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-tcp-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 342335
sha256 = "9bcbab56ca062c3d1c48542ec97945988d6e1e22d00909e1dde2b3c3c54975ef"
build_output = "release/libsnolc_carrier_tcp.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-tcp-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 327116
sha256 = "35447151302d5ccc90eeb2af59f9b16c0586419528751ce8fc275f0826fb78cb"
build_output = "release/libsnolc_carrier_tcp.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/carrier-tcp-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 293415
sha256 = "3cffa8a4131b150d5e4495449e7e388a87623dbce1c7f83e34aecc3a71a4116a"
build_output = "release/libsnolc_carrier_tcp.so"
