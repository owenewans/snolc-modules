name = "owenewans/policy-dummy"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["policy"]
family = "dummy"
roles = ["client", "server"]
entry = "lib/libsnolc_policy_dummy.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-policy-dummy"

[[templates]]
role = "client"
source = "config/templates/modules/policy-dummy.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/policy-dummy-server.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-dummy-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 281740
sha256 = "b4e9b89630b18d5b48dfe56ea0637211831f2806591477acc57543424119bfd2"
build_output = "release/libsnolc_policy_dummy.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-dummy-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 277676
sha256 = "468d232e70bb55fee3578c3136ad39df356cabe6667f9fd3c95e2dc29a536fc0"
build_output = "release/libsnolc_policy_dummy.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-dummy-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 253776
sha256 = "2239456a4154f3039da22194ab302bb8bd1435eca24f7bc34106fa30f57ca513"
build_output = "release/libsnolc_policy_dummy.so"
