name = "owenewans/policy-local"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.4"
wire_version = 1
classes = ["policy"]
family = "local"
roles = ["client", "server"]
entry = "lib/libsnolc_policy_local.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-policy-local"

[[templates]]
role = "client"
source = "config/templates/modules/policy-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/policy.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-local-0.0.4-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 1039806
sha256 = "34ff6d122e97e25e6e54a5354a8f8e7a4d3a11564312cbd5342f310ab21c2a08"
build_output = "release/libsnolc_policy_local.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-local-0.0.4-aarch64-linux-android.tar.gz"
byte_size = 948174
sha256 = "25ccce6bc8221825184d64db6ea2f33cf897f98c71a8eb13da4f6352cbf02ed1"
build_output = "release/libsnolc_policy_local.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.4/policy-local-0.0.4-armv7-linux-androideabi.tar.gz"
byte_size = 866536
sha256 = "235025c9476fe6e29ed023b2265dfe412b7fd2be7333ad934edf2af92f4357f1"
build_output = "release/libsnolc_policy_local.so"
