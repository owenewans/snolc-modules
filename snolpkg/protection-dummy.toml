name = "owenewans/protection-dummy"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.2"
wire_version = 1
classes = ["protection"]
family = "dummy"
roles = ["client", "server"]
entry = "lib/libsnolc_protection_dummy.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-protection-dummy"

[[templates]]
role = "client"
source = "config/templates/modules/protection-dummy.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/protection-dummy-server.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["byte-io"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["byte-io"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["byte-io"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.2/protection-dummy-0.0.2-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 235433
sha256 = "6f1a2da24164577b209b0ec4e51d3b4740b2756644f8e458aed11558eae533cc"
build_output = "release/libsnolc_protection_dummy.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.2/protection-dummy-0.0.2-aarch64-linux-android.tar.gz"
byte_size = 233438
sha256 = "d9ada6e2681b50108ab849394039a61a9a02a3d35dd286c86b4426d98a5703af"
build_output = "release/libsnolc_protection_dummy.so"

[[artifacts]]
