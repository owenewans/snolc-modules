minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.2/protection-dummy-0.0.2-armv7-linux-androideabi.tar.gz"
byte_size = 208336
