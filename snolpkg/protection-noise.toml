name = "owenewans/protection-noise"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.2"
wire_version = 1
classes = ["protection"]
family = "noise"
roles = ["client", "server"]
entry = "lib/libsnolc_protection_noise.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "5939b6f15deb0b966da97d6862b4ca1c9ebedc16"

[build]
package = "snolc-protection-noise"

[[templates]]
role = "client"
source = "config/templates/modules/noise-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/noise.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["noise-nk", "confidentiality", "integrity", "peer-authentication"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["noise-nk", "confidentiality", "integrity", "peer-authentication"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["noise-nk", "confidentiality", "integrity", "peer-authentication"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc-modules/releases/download/v0.0.2/protection-noise-0.0.2-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 393475
sha256 = "a66e23d7dbe4b5aa4f64f2addf7bad0d8213d7c3deba54e1d32bf3ebe5dfe28d"
build_output = "release/libsnolc_protection_noise.so"

[[artifacts]]
